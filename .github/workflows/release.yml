name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Create release if missing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists"
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$TAG_NAME" \
              --generate-notes
          fi

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            packages: ""
            linker: ""
            archive_type: tar.gz
            binary_name: repo-auto-puller
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            linker: aarch64-linux-gnu-gcc
            archive_type: tar.gz
            binary_name: repo-auto-puller
          - runner: macos-latest
            target: x86_64-apple-darwin
            packages: ""
            linker: ""
            archive_type: tar.gz
            binary_name: repo-auto-puller
          - runner: macos-latest
            target: aarch64-apple-darwin
            packages: ""
            linker: ""
            archive_type: tar.gz
            binary_name: repo-auto-puller
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            packages: ""
            linker: ""
            archive_type: zip
            binary_name: repo-auto-puller.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux cross toolchain
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release -p repo-auto-puller --target ${{ matrix.target }}

      - name: Package tar archive
        if: matrix.archive_type == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/repo-auto-puller
          tar -czf repo-auto-puller-${{ matrix.target }}.tar.gz -C dist repo-auto-puller

      - name: Package zip archive
        if: matrix.archive_type == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/repo-auto-puller.exe"
          Compress-Archive -Path "dist/repo-auto-puller.exe" -DestinationPath "repo-auto-puller-${{ matrix.target }}.zip" -Force

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          asset="repo-auto-puller-${{ matrix.target }}.${{ matrix.archive_type }}"
          gh release upload "$TAG_NAME" "$asset" --clobber
